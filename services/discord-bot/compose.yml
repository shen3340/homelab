services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: discord-bot
    restart: unless-stopped

    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}

      LASTGLANCE_CHANNEL_ID: ${LASTGLANCE_CHANNEL_ID}
      LASTGLANCE_CHECK_INTERVAL_MINUTES: ${LASTGLANCE_CHECK_INTERVAL_MINUTES:-60}
      LASTGLANCE_REMINDER_INTERVAL_DAYS: ${LASTGLANCE_REMINDER_INTERVAL_DAYS:-7}

      RADARR_URL: ${RADARR_URL}
      RADARR_API_KEY: ${RADARR_API_KEY}

    volumes:
      - /volume1/docker/discord-bot/data:/data
      - /volume1/docker/lastglance-webdav/GLANCE/lastglance/lastglance-sync.json:/data/lastglance-sync.json
      - /volume1/docker/lastglance-notifier:/state

    ports:
      - "8088:8000"

    networks:
      - media

networks:
  media:
    external: true
