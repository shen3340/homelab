services:
  webhook-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: webhook-dispatcher

    restart: unless-stopped

    environment:
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}

      GITHUB_REPOSITORY: shen3340/homelab
      GITHUB_BRANCH: refs/heads/main

      PORTAINER_URL: https://portainer:9443

      PORTAINER_WEBHOOK_BOOKSTACK: ${PORTAINER_WEBHOOK_BOOKSTACK}
      PORTAINER_WEBHOOK_BOOKSTACKRAG: ${PORTAINER_WEBHOOK_BOOKSTACKRAG}
      PORTAINER_WEBHOOK_CLOUDFLARED: ${PORTAINER_WEBHOOK_CLOUDFLARED}
      PORTAINER_WEBHOOK_DOZZLE: ${PORTAINER_WEBHOOK_DOZZLE}
      PORTAINER_WEBHOOK_FLARESOLVERR: ${PORTAINER_WEBHOOK_FLARESOLVERR}
      PORTAINER_WEBHOOK_HOMEASSISTANT: ${PORTAINER_WEBHOOK_HOMEASSISTANT}
      PORTAINER_WEBHOOK_JELLYFIN: ${PORTAINER_WEBHOOK_JELLYFIN}
      PORTAINER_WEBHOOK_OLLAMAGATEWAY: ${PORTAINER_WEBHOOK_OLLAMAGATEWAY}
      PORTAINER_WEBHOOK_OPENWAKEWORD: ${PORTAINER_WEBHOOK_OPENWAKEWORD}
      PORTAINER_WEBHOOK_OPENWEBUI: ${PORTAINER_WEBHOOK_OPENWEBUI}
      PORTAINER_WEBHOOK_PIPER: ${PORTAINER_WEBHOOK_PIPER}
      PORTAINER_WEBHOOK_PORTAINER: ${PORTAINER_WEBHOOK_PORTAINER}
      PORTAINER_WEBHOOK_PROWLARR: ${PORTAINER_WEBHOOK_PROWLARR}
      PORTAINER_WEBHOOK_QBITTORRENT: ${PORTAINER_WEBHOOK_QBITTORRENT}
      PORTAINER_WEBHOOK_QDRANT: ${PORTAINER_WEBHOOK_QDRANT}
      PORTAINER_WEBHOOK_RADARR: ${PORTAINER_WEBHOOK_RADARR}
      PORTAINER_WEBHOOK_UPTIME_KUMA: ${PORTAINER_WEBHOOK_UPTIME_KUMA}
      PORTAINER_WEBHOOK_VAULTWARDEN: ${PORTAINER_WEBHOOK_VAULTWARDEN}
      PORTAINER_WEBHOOK_VIKUNJA: ${PORTAINER_WEBHOOK_VIKUNJA}
      PORTAINER_WEBHOOK_WHISPER: ${PORTAINER_WEBHOOK_WHISPER}

      PORTAINER_TIMEOUT: 10
      LOG_LEVEL: INFO

    networks:
      - internal

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  internal:
    external: true
