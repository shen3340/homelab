services:
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped

    environment:
      - TZ=America/New_York

    command:
      - --label-enable
      - --cleanup
      - --schedule
      - "0 0 3 * * *"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - internal

networks:
  internal:
    external: true
