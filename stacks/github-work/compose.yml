services:
  github-mcp-work:
    image: ghcr.io/github/github-mcp-server:latest
    command:
      - http
      - --port
      - "8080"
    environment:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
      GITHUB_READ_ONLY: "1"
      GITHUB_TOOLSETS: "context,repos"
      GITHUB_MCP_SERVER_NAME: "github-work"
      GITHUB_MCP_SERVER_TITLE: "Work GitHub MCP"
    networks:
      - ai-net
    restart: unless-stopped

networks:
  ai-net:
    external: true
