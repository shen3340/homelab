services:
  bookstack:
    image: linuxserver/bookstack:latest
    container_name: bookstack

    environment:
      - PUID=1026
      - PGID=100
      - TZ=America/New_York

      - APP_URL=https://docs.shen3340.com
      - APP_KEY=${APP_KEY}

      - DB_HOST=bookstack-db
      - DB_PORT=3306
      - DB_USERNAME=bookstack
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_DATABASE=bookstack

    volumes:
      - /volume1/docker/bookstack/config:/config

    ports:
      - 6876:80

    restart: unless-stopped

    depends_on:
      - bookstack-db

    networks:
      - internal

  bookstack-db:
    image: linuxserver/mariadb:latest
    container_name: bookstack-db

    environment:
      - PUID=1026
      - PGID=100
      - TZ=America/New_York

      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

    volumes:
      - /volume1/docker/bookstack/database:/config

    restart: unless-stopped

    networks:
      - internal

  rag-webhook:
    build:
      context: ../../services/bookstack-rag
      dockerfile: Dockerfile

    container_name: rag-webhook

    restart: unless-stopped

    environment:
      BOOKSTACK_URL: ${BOOKSTACK_URL}
      BOOKSTACK_TOKEN_ID: ${BOOKSTACK_TOKEN_ID}
      BOOKSTACK_TOKEN_SECRET: ${BOOKSTACK_TOKEN_SECRET}

      QDRANT_URL: ${QDRANT_URL}

      OLLAMA_URL: ${OLLAMA_URL}
      EMBED_MODEL: nomic-embed-text

      QDRANT_COLLECTION: bookstack
      CHUNK_SIZE: 2000
      CHUNK_OVERLAP: 300

      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: 8000

      BOOKSTACK_WEBHOOK_IP:

    networks:
      - internal
      - ai-net

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  internal:
    external: true

  ai-net:
    external: true
