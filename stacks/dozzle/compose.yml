
services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      DOZZLE_ENABLE_ACTIONS: "true"
      DOZZLE_AUTO_UPDATE: daily
      DOZZLE_AUTO_UPDATE_TIME: "03:00"
      DOZZLE_UPDATE_CONTAINERS: labelled

      DOZZLE_AUTO_CLEANUP: weekly
      DOZZLE_AUTO_CLEANUP_TIME: "04:00"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dozzle_data:/data

    networks:
      - internal

volumes:
  dozzle_data:

networks:
  internal:
    external: true
