services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped

    ports:
      - "8081:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data

    networks:
      - internal

    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  dozzle_data:

networks:
  internal:
    external: true
