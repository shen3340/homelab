services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "3201:6333"
      - "3202:6334"
    volumes:
      - /volume1/docker/qdrant:/qdrant/storage
    networks:
      - ai-net
    labels:
      - dev.dozzle.update=auto

networks:
  ai-net:
    external: true
