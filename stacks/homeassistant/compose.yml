services:
  homeassistant:
    container_name: homeassistant
    image: home-assistant/home-assistant:latest
    restart: unless-stopped
    ports:
      - "8123:8123"
    networks:
      - ai-net

    volumes:
      - /volume1/docker/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro

    environment:
      - TZ=America/New_York

networks:
  ai-net:
    external: true
