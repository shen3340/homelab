services:
  homeassistant:
    container_name: homeassistant
    image: homeassistant/home-assistant:latest
    restart: unless-stopped
    ports:
      - "3301:8123"
    networks:
      - ai-net

    volumes:
      - /volume1/docker/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro

    environment:
      - TZ=America/New_York

    labels:
      - dev.dozzle.update=auto

networks:
  ai-net:
    external: true
