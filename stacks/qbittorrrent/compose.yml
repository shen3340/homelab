services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped

    environment:
      - PUID=1026
      - PGID=100
      - TZ=America/New_York
      - WEBUI_PORT=8080

    volumes:
      - /volume1/docker/qbittorrent/config:/config
      - /volume1/media:/data

    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"

    networks:
      - media

networks:
  media:
    external: true
