services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - /volume1/docker/uptime-kuma:/app/data
    networks:
      - internal
      - media
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  internal:
    external: true
  media:
    external: true
