repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: python scripts/precommit_ruff.py
        language: python
        additional_dependencies:
          - ruff==0.12.10
        types: [python]

      - id: docker-hub-images-only
        name: Docker Hub images only
        entry: bash -c 'grep -RInE "^[[:space:]]*image:[[:space:]]*" stacks --include="*.yml" --include="*.yaml" | awk '"'"'{img=$0; sub(/^[[:space:]]*image:[[:space:]]*/, "", img); split(img,p,"/"); if (p[1] ~ /\./ || p[1] ~ /:/ || p[1] == "localhost") print}'"'"''
        language: system
        pass_filenames: false
